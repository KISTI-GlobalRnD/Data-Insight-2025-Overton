    Plotly.restyle(gd, {'x': [[], []], 'y': [[], []]}, [focusMain, focusKorea]);
    Plotly.restyle(gd, {'x': [[], []], 'y': [[], []], 'marker.angle': [[], []]}, [arrowsMain, arrowsKorea]);
    Plotly.restyle(gd, {'line.color': [BASE_MAIN_COLOR, BASE_KOREA_COLOR]}, [baseMain, baseKorea]);
  }

  gd.on('plotly_hover', function(ev) {
    if (lockNode) return;
    if (!ev || !ev.points || !ev.points.length) return;
    var pt = ev.points[0] || {};
    var d = pt.data || {};
    if (traceRole(d) !== 'nodes') return;
    var cd = pt.customdata || [];
    var nodeId = cd[0];
    if (!nodeId) return;
    if (resetTimer) {
      clearTimeout(resetTimer);
      resetTimer = null;
    }
    applyFocus(nodeId);
  });

  gd.on('plotly_unhover', function() {
    if (lockNode) return;
    if (resetTimer) clearTimeout(resetTimer);
    resetTimer = setTimeout(function() {
      resetFocus();
      resetTimer = null;
    }, 80);
  });

  gd.on('plotly_click', function(ev) {
    if (!ev || !ev.points || !ev.points.length) return;
    var pt = ev.points[0] || {};
    var d = pt.data || {};
    if (traceRole(d) !== 'nodes') return;
    var cd = pt.customdata || [];
    var nodeId = cd[0];
    if (!nodeId) return;

    if (resetTimer) {
      clearTimeout(resetTimer);
      resetTimer = null;
    }

    if (lockNode === nodeId) {
      lockNode = null;
      resetFocus();
      return;
    }
    lockNode = nodeId;
    applyFocus(nodeId);
  });

  gd.on('plotly_doubleclick', function() {
    lockNode = null;
    if (resetTimer) {
      clearTimeout(resetTimer);
      resetTimer = null;
    }
    resetFocus();
  });
})();

                        })                };            </script>        </div>
